# general settings
name: train_MVQ_bbp2_32C_4V_16384E
model_type: SSCModel
num_gpu: auto
manual_seed: 42

# dataset and data loader settings
datasets:
  train:
    name: div2k
    type: HR_image
    dataroot_gt: datasets/DIV2K/DIV2K_train_HR
    # dataroot_lq: datasets/DIV2K/DIV2K_train_LR_bicubic/X2_sub
    # meta_info_file: drct/data/meta_info/meta_info_DIV2K800sub_GT.txt
    io_backend:
      type: disk

    gt_size: &img_value 256
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 20
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 4
    prefetch_mode: ~

  val_1:
    name: kodak
    type: KodakDataset
    dataroot_gt: ./datasets/Kodak24
    # dataroot_lq: ./datasets/Set5/LRbicx2
    io_backend:
      type: disk
    crop_divisor: 128

# network structures
find_unused_parameters: true
network_g:
  type: SwinSSC
  args:
    model_size: small
    C: &feature_dim 32
    channel_type: awgn           # ['awgn', 'rayleigh']
    model: SwinJSCC_w/o_SAandRA  # ['SwinJSCC_w/o_SAandRA', 'SwinJSCC_w/_SA', 'SwinJSCC_w/_RA', 'SwinJSCC_w/_SAandRA']
    multiple_snr: !!str -2,1,4,7,10,13,16
    distortion_metric: MSE
    trainset: DIV2K
    testset: kodak
    training: true

    pass_channel: true
    image_dims: [3, *img_value, *img_value]
    downsample: 4
    norm: false
  rq_kwargs:
    restart_unused_codes: true
    latent_shape: [16, 16, *feature_dim]
    embed_dim: 4
    n_embed: 16384
    # rq_depth: 5
    rq_depth: 4
    shared_codebook: false
    decay: 0.99
    trainable_bit_flip_prob: true
    bit_flip_prob_init: 3.9e-6
    # bit_flip_prob_min: [0.0005, 0.001, 0.0045, 0.02, 0.05]
    bit_flip_prob_min: [0.0005, 0.001, 0.0045, 0.02]
    bit_flip_prob_max: 0.5
    # bit_flip_reg_weight: [0.125, 0.25, 0.5, 1.0, 2.0]
    bit_flip_reg_weight: [0.125, 0.25, 0.5, 1.0]

# path
path:
  pretrain_network_g: experiments/train_SSC_from_scratch_32C/models/net_g_latest.pth
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 3e-5
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [110000, 140000, 180000]  # [0.5, 0.8, 0.9, 0.95]*total_iter
    # milestones: [250000, 400000, 450000, 475000]  # [0.5, 0.8, 0.9, 0.95]*total_iter
    gamma: 0.5

  # unfreeze_iter: 100000  # unfreeze encoder and decoder at this iter, if load_path is not None and unfreeze_iter is not None, freeze
  total_iter: 200000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: MSELoss
    loss_weight: 1.0
    reduction: mean
  commit_loss_weight: !!float 0.25

# validation settings
val:
  val_freq: !!float 5e3
  save_img: true
  pbar: False

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true
      better: higher

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
