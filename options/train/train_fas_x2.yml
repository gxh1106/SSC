# general settings
name: train_fas_SRx2_from_scratch
model_type: DSTNModel
scale: &scale_val 2
num_gpu: auto   # set num_gpu: 0 for cpu mode
manual_seed: 0

num_Nr: 4
H_size: &H_size_val [60, 240]

# dataset and data loader settings
datasets:
  train:
    name: FASChannel
    type: FASChannelDataset
    dataroot_gt: datasets/FAS/train
    dataroot_lq: ~
    io_backend:
      type: disk

    add_noise: false
    noise_maxlevel: 0.001

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 12
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
    pin_memory: true

  val_1:
    name: ChannelVal
    type: FASChannelDataset
    dataroot_gt: datasets/FAS/val
    dataroot_lq: ~

# network structures
network_g:
  img_size: *H_size_val
  type: DSTN
  upscale: *scale_val
  in_chans: 2
  window_size: 10
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [250000, 400000, 450000, 475000]
    gamma: 0.5

  total_iter: 500000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3    #5e3
  save_img: true
  num_save: 2  # number of images to save
  pbar: False
  num_val: 1000  # number of validation images, if None, use 100 images in the folder

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher  # the higher, the better. Default: higher

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
