name: test_fas_SRx2
model_type: DSTNModel
scale: &scale_val 2
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

num_Nr: 4
H_size: &H_size_val [60, 240]

datasets:
  test_1:  # the 1st test dataset
    name: ChannelTest
    type: FASChannelDataset
    dataroot_gt: datasets/FAS/test
    dataroot_lq: ~
    io_backend:
      type: disk

# network structures
network_g:
  img_size: *H_size_val
  type: DSTN
  upscale: *scale_val
  in_chans: 2
  window_size: 10
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'


# path
path:
  pretrain_network_g: ./experiments/pretrained_models/net_g_445000.pth
  strict_load_g: true
  param_key_g: 'params_ema'

# test settings
val:
  save_img: true
  num_save: 2  # number of images to save
  suffix: ~  # add suffix to saved images, if None, use exp name
  num_val: 1000  # number of test images, if None, use all images in the folder

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
